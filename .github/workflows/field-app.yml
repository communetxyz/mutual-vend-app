name: KSJ field app
on:
  push:
    branches: [main, feat/ksj-field-app]
    paths: ['field/**', '.github/workflows/field-app.yml']
  pull_request:
    paths: ['field/**', '.github/workflows/field-app.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: field
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: field/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-test-results
          path: field/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: field-static-site
          path: field/dist
